name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # the auth and workspace matrices spawn their own servers on scratch ports,
      # so no service is needed
      - run: npm run auth-smoke
      - run: npm run workspace-smoke
      - run: npm run voice-smoke
      # TLS: generates its own self-signed cert into a scratch dir (openssl is on the runner)
      - run: npm run tls-smoke
