name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # the auth and workspace matrices spawn their own servers on scratch ports,
      # so no service is needed
      - run: npm run auth-smoke
      - run: npm run workspace-smoke
      # the backend registry: rows, the isolation guard, and one real slot spawned from a row
      # (it inherits the operator's test home when present, and self-skips what is not there)
      - run: npm run backend-smoke
      - run: npm run voice-smoke
      # the reader's utterance rule is pure text logic: unit-checked, no browser
      - run: npm run sentence-units
      # token counts are formatted in binary units (1024) — the 512K preset must read 512k
      - run: npm run token-format
      # the terminal's ANSI palettes are per theme, judged against their own background
      - run: npm run terminal-palette
      # (the tls-smoke step is gone with the in-process TLS listener it tested —
      #  it was dropped from the source, and CI kept calling a script that no longer exists)
