plugins {
    id 'com.android.application'
}

android {
    namespace 'app.agentus.companion'
    compileSdk 36
    compileSdkMinor 1
    // AGP defaults to build-tools 35.0.0, which this machine does not have; 36.1.0 is what
    // ships with the installed API 36.1 platform.
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId "app.agentus.companion"
        minSdk 26            // Notification channels; also the floor for a simple FGS
        targetSdk 36
        versionCode 18
        versionName "0.5.10"
    }

    buildTypes {
        release {
            // Signed with the machine's debug key on purpose: this is a sideloaded
            // personal companion, and it must be updatable in place across rebuilds.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        // the app reports its own version to the server at pairing (contract: appVersion)
        buildConfig true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // HTTP + WebSocket, the only dep
}